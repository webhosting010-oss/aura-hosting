{% extends "base.html" %}
{% block title %}Reset Password - AURA Hosting{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card pella-card">
        <div class="auth-header">
            <div class="auth-brand-icon glow-cyan">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 class="auth-title">Forgot Password</h1>
            <p class="auth-desc">Enter your account email to receive a 6-digit verification code</p>
        </div>

        <form method="POST" action="{{ url_for('forgot_password') }}" class="cyber-form">
            <div class="form-group">
                <label class="form-label">Registered Email Address</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" name="email" class="cyber-input" placeholder="you@domain.com" required autocomplete="email" autofocus>
                </div>
            </div>

            <button type="submit" class="btn-cyber-primary btn-block">
                <i class="fa-solid fa-paper-plane"></i>
                <span>Send OTP Code</span>
            </button>
        </form>

        <div class="auth-footer-row">
            <a href="{{ url_for('login') }}" class="auth-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>
            <span class="auth-dot">•</span>
            <a href="{{ url_for('register') }}" class="auth-link">Create Account</a>
        </div>
    </div>
</div>
{% endblock %}
