{% extends "base.html" %}
{% block title %}Verify OTP - AURA Hosting{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card pella-card">
        <div class="auth-header">
            <div class="auth-brand-icon glow-purple">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="auth-title">Verify OTP Code</h1>
            <p class="auth-desc">We sent a 6-digit code to <strong style="color: var(--accent-cyan);">{{ email }}</strong></p>
        </div>

        <form method="POST" action="{{ url_for('verify_otp') }}" class="cyber-form" id="otp-form">
            <div class="form-group" style="text-align: center;">
                <label class="form-label" style="text-align: center; display: block; margin-bottom: 0.75rem;">Enter 6-Digit Verification Code</label>
                
                <div class="otp-inputs-grid">
                    <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" name="digit_1" id="d1" autofocus required autocomplete="off">
                    <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" name="digit_2" id="d2" required autocomplete="off">
                    <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" name="digit_3" id="d3" required autocomplete="off">
                    <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" name="digit_4" id="d4" required autocomplete="off">
                    <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" name="digit_5" id="d5" required autocomplete="off">
                    <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" name="digit_6" id="d6" required autocomplete="off">
                </div>
                <input type="hidden" name="otp_code" id="otp_code_hidden">
            </div>

            <div class="otp-timer-bar">
                <span><i class="fa-regular fa-clock"></i> Code expires in: <strong id="timer-text" style="color: var(--accent-cyan);">10:00</strong></span>
            </div>

            <button type="submit" class="btn-cyber-primary btn-block" id="btn-verify">
                <i class="fa-solid fa-circle-check"></i>
                <span>Verify & Continue</span>
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center;">
            <form method="POST" action="{{ url_for('resend_otp') }}" style="display: inline;">
                <button type="submit" class="btn-text-link" id="resend-btn">
                    <i class="fa-solid fa-rotate-right"></i> Didn't receive code? Resend OTP
                </button>
            </form>
        </div>

        <div class="auth-footer-row" style="margin-top: 1rem;">
            <a href="{{ url_for('forgot_password') }}" class="auth-link">
                <i class="fa-solid fa-arrow-left"></i> Change Email
            </a>
            <span class="auth-dot">•</span>
            <a href="{{ url_for('login') }}" class="auth-link">Cancel</a>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const boxes = document.querySelectorAll('.otp-box');
    const hiddenInput = document.getElementById('otp_code_hidden');
    const form = document.getElementById('otp-form');

    function syncHidden() {
        let code = '';
        boxes.forEach(b => code += b.value);
        if (hiddenInput) hiddenInput.value = code;
    }

    boxes.forEach((box, index) => {
        box.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val.length === 1 && index < boxes.length - 1) {
                boxes[index + 1].focus();
            }
            syncHidden();
            if (index === boxes.length - 1 && val.length === 1) {
                syncHidden();
                if (hiddenInput.value.length === 6) {
                    form.submit();
                }
            }
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !box.value && index > 0) {
                boxes[index - 1].focus();
            }
        });

        box.addEventListener('paste', (e) => {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text').trim();
            if (/^\d{6}$/.test(text)) {
                text.split('').forEach((digit, i) => {
                    if (boxes[i]) boxes[i].value = digit;
                });
                syncHidden();
                form.submit();
            }
        });
    });

    // Countdown Timer
    let totalSeconds = 600;
    const timerEl = document.getElementById('timer-text');
    const timerInterval = setInterval(function() {
        totalSeconds--;
        if (totalSeconds <= 0) {
            clearInterval(timerInterval);
            if (timerEl) {
                timerEl.textContent = 'Expired';
                timerEl.style.color = '#ef4444';
            }
            return;
        }
        const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
        const s = (totalSeconds % 60).toString().padStart(2, '0');
        if (timerEl) timerEl.textContent = `${m}:${s}`;
    }, 1000);
});
</script>
{% endblock %}
