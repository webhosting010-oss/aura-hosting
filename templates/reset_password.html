{% extends "base.html" %}
{% block title %}Set New Password - AURA Hosting{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card pella-card">
        <div class="auth-header">
            <div class="auth-brand-icon glow-emerald">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <h1 class="auth-title">Set New Password</h1>
            <p class="auth-desc">OTP Verified. Create a strong new password for <strong style="color: var(--accent-cyan);">{{ email }}</strong></p>
        </div>

        <form method="POST" action="{{ url_for('reset_password') }}" class="cyber-form">
            <div class="form-group">
                <label class="form-label">New Password</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" id="new-password" class="cyber-input" placeholder="At least 6 characters" required autocomplete="new-password" autofocus>
                    <button type="button" class="btn-toggle-eye" onclick="togglePass('new-password', this)">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
                <div class="password-strength-bar">
                    <div class="strength-fill" id="strength-fill"></div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-shield-halved"></i>
                    <input type="password" name="confirm_password" id="confirm-password" class="cyber-input" placeholder="Repeat your new password" required autocomplete="new-password">
                    <button type="button" class="btn-toggle-eye" onclick="togglePass('confirm-password', this)">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-cyber-primary btn-block">
                <i class="fa-solid fa-check-double"></i>
                <span>Update Password & Sign In</span>
            </button>
        </form>

        <div class="auth-footer-row">
            <a href="{{ url_for('login') }}" class="auth-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>
</div>

<script>
function togglePass(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}

document.getElementById('new-password').addEventListener('input', function(e) {
    const val = e.target.value;
    const fill = document.getElementById('strength-fill');
    let strength = 0;
    if (val.length >= 6) strength += 30;
    if (val.length >= 10) strength += 30;
    if (/[A-Z]/.test(val) && /[0-9]/.test(val)) strength += 25;
    if (/[^A-Za-z0-9]/.test(val)) strength += 15;

    fill.style.width = strength + '%';
    if (strength <= 30) {
        fill.style.background = '#ef4444';
    } else if (strength <= 70) {
        fill.style.background = '#f59e0b';
    } else {
        fill.style.background = '#10b981';
    }
});
</script>
{% endblock %}
